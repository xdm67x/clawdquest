name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS (arm64)
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build app and DMG
        run: cargo xtask dmg "${GITHUB_REF_NAME#v}"

      - name: Verify binary architecture
        run: |
          file dist/ClawdQuest.app/Contents/MacOS/clawdquest
          lipo -archs dist/ClawdQuest.app/Contents/MacOS/clawdquest | grep -q arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ClawdQuest-${GITHUB_REF_NAME#v}-macOS-arm64.dmg" \
            --title "Clawd Quest ${GITHUB_REF_NAME#v}" \
            --generate-notes
